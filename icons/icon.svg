<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Gestor de Cuentas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b3446"/>
      <stop offset="100%" stop-color="#12151c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- Barras: gasto (rojo) e ingreso (verde) -->
  <rect x="104" y="286" width="46" height="122" rx="14" fill="#fb7185" opacity="0.85"/>
  <rect x="176" y="238" width="46" height="170" rx="14" fill="#5b8cff" opacity="0.55"/>
  <rect x="248" y="300" width="46" height="108" rx="14" fill="#fb7185" opacity="0.85"/>
  <rect x="320" y="196" width="46" height="212" rx="14" fill="#34d399" opacity="0.9"/>

  <!-- Línea de tendencia ascendente -->
  <path d="M104 268 L176 216 L248 236 L320 150 L392 108"
        fill="none" stroke="url(#line)" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="392" cy="108" r="18" fill="#34d399"/>
</svg>
