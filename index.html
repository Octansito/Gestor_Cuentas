<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="description" content="Gestor de gastos, ingresos y gastos recurrentes con proyección a largo plazo. Funciona sin conexión y guarda los datos solo en tu dispositivo." />
  <title>Gestor de Cuentas</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar__inner">
        <h1 class="topbar__title" id="view-title">Resumen</h1>
        <div class="topbar__actions" id="topbar-actions">
          <a class="btn btn--ghost topbar__settings" href="#/ajustes" aria-label="Ajustes" title="Ajustes">
            <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9.4 4c0-.6-.1-1.2-.2-1.7l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-3-1.7L15.4 2H8.6l-.4 2.6c-1.1.4-2.1 1-3 1.7l-2.4-1-2 3.4 2 1.6a8.6 8.6 0 0 0 0 3.4l-2 1.6 2 3.4 2.4-1c.9.7 1.9 1.3 3 1.7l.4 2.6h6.8l.4-2.6c1.1-.4 2.1-1 3-1.7l2.4 1 2-3.4-2-1.6c.1-.5.2-1.1.2-1.7z"/></svg>
          </a>
        </div>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Navegación principal">
      <a class="tab" href="#/resumen" data-tab="resumen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        <span>Resumen</span>
      </a>
      <a class="tab" href="#/movimientos" data-tab="movimientos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h12v2H3v-2z"/></svg>
        <span>Movimientos</span>
      </a>
      <a class="tab" href="#/recurrentes" data-tab="recurrentes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4V1L8 5l4 4V6a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
        <span>Recurrentes</span>
      </a>
      <a class="tab" href="#/inversiones" data-tab="inversiones">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18v-2H5V3H3zm4 10l3.5-4.5 2.5 3L17 7l1.5 1.2L13 15l-2.5-3L7 16.5V13z"/></svg>
        <span>Cartera</span>
      </a>
      <a class="tab" href="#/historico" data-tab="historico">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3a9 9 0 0 0-9 9H1l4 4 4-4H6a7 7 0 1 1 7 7 6.9 6.9 0 0 1-4.2-1.4l-1.5 1.5A9 9 0 1 0 13 3zm-1 5v5l4.3 2.5.7-1.2-3.5-2.1V8z"/></svg>
        <span>Histórico</span>
      </a>
      <a class="tab" href="#/proyeccion" data-tab="proyeccion">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18v-2H5V3H3zm4 12l4-4 3 3 5-6 1.5 1.2-6.5 7.8-3-3-3 3L7 15z"/></svg>
        <span>Proyección</span>
      </a>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
